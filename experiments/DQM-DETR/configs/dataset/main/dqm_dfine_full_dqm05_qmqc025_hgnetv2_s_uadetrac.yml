__include__: [
  '../../deim_dfine/dfine_hgnetv2_s_coco.yml',
  '../uadetrac_detection.yml',
]

output_dir: ./outputs/main/dqm_dfine_full_dqm05_qmqc025_hgnetv2_s_uadetrac

tuning: pretrained/dfine_s_coco.pth

epoches: 100

criterion: DQMDFINECriterion

DEIM:
  decoder: DQMDFINETransformer

DQMDFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  dqm_hidden_dim: 128
  dqm_num_heads: 4
  dqm_dropout: 0.0
  dqm_strength: 0.5
  clean_dqm_strength: 0.0

DQMDFINECriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  qmqc_weight: 0.25
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  total_batch_size: 16
  num_workers: 12
  dataset:
    transforms:
      policy:
        epoch: 88
  collate_fn:
    type: PairedDegradationCollateFunction
    stop_epoch: 88
    scale_low_ratio: 0.75
    scale_high_ratio: 1.25
    degradation_prob: 1.0
    min_ops: 1
    max_ops: 2
    low_light_range: [0.45, 0.85]
    contrast_range: [0.55, 0.9]
    noise_std_range: [0.01, 0.04]
    blur_kernel: 5
    blur_sigma_range: [0.3, 1.2]
    fog_alpha_range: [0.08, 0.22]

val_dataloader:
  total_batch_size: 16
  num_workers: 12

vis_after_train: True
vis_num_images: 8
vis_score_thr: 0.35

weather_subset_eval:
  every_n_epochs: 5
