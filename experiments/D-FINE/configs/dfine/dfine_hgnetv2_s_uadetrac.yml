__include__: [
  './dfine_hgnetv2_s_coco.yml',
  '../dataset/uadetrac_detection.yml',
]

output_dir: ./output/dfine_hgnetv2_s_uadetrac

tuning: pretrained/dfine_s_coco.pth

epochs: 132

train_dataloader:
  total_batch_size: 16
  num_workers: 8
  pin_memory: False
  dataset:
    transforms:
      policy:
        epoch: 120
  collate_fn:
    stop_epoch: 120
    scale_low_ratio: 0.75
    scale_high_ratio: 1.25

val_dataloader:
  total_batch_size: 16
  num_workers: 8
  pin_memory: False
