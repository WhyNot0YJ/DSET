# Fair RT-DETR baseline: keep pretrained decoder attention and remove only dense FFN weights.
__include__: [
  '../dataset/uadetrac_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./outputs/rtdetrv2_r18vd_uadetrac_no_decoder_ffn_pretrain
tuning: ./pretrained/rtdetrv2_r18vd_120e_coco_rerun_48.1_no_decoder_ffn.pth

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: False

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3

epoches: 132

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

train_dataloader:
  total_batch_size: 16
  num_workers: 12
  pin_memory: False
  dataset:
    transforms:
      policy:
        epoch: 129
  collate_fn:
    stop_epoch: 129

val_dataloader:
  total_batch_size: 16
  num_workers: 12
  pin_memory: False
